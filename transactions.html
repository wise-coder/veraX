<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Adventure | Transactions</title>
  <script src="theme.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <h3>PARKING</h3>
    <h4>ADVENTURE</h4>

    <ul>
      <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li><a href="vehicles.html"><i class="bi bi-car-front-fill"></i> Vehicles</a></li>
      <li><a href="parking-slots.html"><i class="bi bi-p-square"></i> Parking Slots</a></li>
      <li class="active"><a href="transactions.html"><i class="bi bi-arrow-left-right"></i> Transactions</a></li>
      <li><a href="payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
      <li><a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a></li>
      <li><a href="users.html"><i class="bi bi-people"></i> Users</a></li>
      <li><a href="settings.html"><i class="bi bi-gear"></i> Settings</a></li>
      <li><a href="login.html" data-logout><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>

    <div class="sidebar-illustration" aria-hidden="true">
      <div class="tree tree-left"></div>
      <div class="tree tree-center"></div>
      <div class="parking-post">P</div>
      <div class="mini-car"></div>
      <div class="hill-line hill-one"></div>
      <div class="hill-line hill-two"></div>
    </div>
  </aside>

  <main class="main transactions-main">
    <nav class="topbar">
      <i class="bi bi-list menu-icon"></i>
      <div class="admin">
        <i class="bi bi-bell"></i>
        <div class="avatar"></div>
        <div>
          <strong>Admin</strong>
          <small>Administrator</small>
        </div>
        <i class="bi bi-chevron-down admin-chevron"></i>
      </div>
    </nav>

    <section class="transactions-page">
      <div class="transactions-header">
        <h1>Transactions</h1>
      </div>

      <div class="transactions-toolbar">
        <div class="vehicles-search-card transactions-search-card">
          <i class="bi bi-search"></i>
          <input type="search" id="transactionSearch" placeholder="Search transaction...">
        </div>

        <button class="transactions-action-btn" type="button" id="filterTransactionsBtn">
          <i class="bi bi-funnel"></i>
          Filter
        </button>

        <button class="transactions-action-btn" type="button" id="exportTransactionsBtn">
          <i class="bi bi-download"></i>
          Export
        </button>
      </div>

      <div class="vehicles-table-card transactions-table-card">
        <table class="vehicles-table transactions-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Plate Number</th>
              <th>Type</th>
              <th>Parking Slot</th>
              <th>Date &amp; Time</th>
              <th>Status</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="transactionsTable"></tbody>
        </table>

        <div class="vehicles-table-footer">
          <p id="transactionsTableInfo">Loading transactions...</p>
          <div class="vehicles-pagination" id="transactionsPagination">
            <button type="button" data-transactions-page="prev" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button>
            <button type="button" data-transactions-page="1" class="active" aria-current="page">1</button>
            <button type="button" data-transactions-page="2">2</button>
            <button type="button" data-transactions-page="3">3</button>
            <button type="button" data-transactions-page="next" aria-label="Next page"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script src="script.js"></script>
</body>
</html>
