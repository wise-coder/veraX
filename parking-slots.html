<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>veraX | Parking Slots</title>
  <link rel="icon" type="image/png" href="images/verax browser icon.png">
  <script src="theme.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <h3 class="sidebar-brand">veraX</h3>

    <ul>
      <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li><a href="vehicles.html"><i class="bi bi-car-front-fill"></i> Vehicles</a></li>
      <li class="active"><a class="active-link" href="parking-slots.html"><i class="bi bi-p-square"></i> Parking Slots</a></li>
      <li><a href="transactions.html"><i class="bi bi-arrow-left-right"></i> Transactions</a></li>
      <li><a href="payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
      <li><a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a></li>
      <li><a href="users.html"><i class="bi bi-people"></i> Users</a></li>
      <li><a href="settings.html"><i class="bi bi-gear"></i> Settings</a></li>
      <li><a href="login.html" data-logout><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>

    <div class="sidebar-illustration" aria-hidden="true">
      <img class="sidebar-car-image" src="images/vecteezy_white-modern-car-isolated-on-transparent-background-3d_29913085.png" alt="">
      <div class="parking-post">P</div>
    </div>
  </aside>

  <main class="main parking-slots-main">
    <nav class="topbar">
      <button type="button" class="menu-toggle" aria-label="Open navigation">
        <i class="bi bi-list menu-icon"></i>
      </button>
      <div class="admin">
        <i class="bi bi-bell"></i>
        <div class="avatar"></div>
        <div>
          <strong>Admin</strong>
          <small>Administrator</small>
        </div>
        <i class="bi bi-chevron-down admin-chevron"></i>
      </div>
    </nav>

    <section class="parking-slots-page">
      <div class="parking-slots-header">
        <h1>Parking Slots</h1>
        <div class="parking-slots-toolbar">
          <button class="vehicles-add-btn" type="button" id="addSlotButton">
            <i class="bi bi-plus-lg"></i>
            Add New Slot
          </button>
          <div class="vehicles-search-card parking-slots-search">
            <i class="bi bi-search"></i>
            <input type="search" id="slotSearch" placeholder="Search Slot...">
          </div>
        </div>
      </div>

      <section class="parking-slots-stats">
        <div class="slot-stat-card">
          <div class="slot-stat-icon circle-icon">P</div>
          <div>
            <p>Total Slots</p>
            <h2 id="slotsPageTotal">--</h2>
          </div>
        </div>
        <div class="slot-stat-card">
          <div class="slot-stat-icon"><i class="bi bi-car-front-fill"></i></div>
          <div>
            <p>Occupied Slots</p>
            <h2 id="slotsPageOccupied">--</h2>
          </div>
        </div>
        <div class="slot-stat-card">
          <div class="slot-stat-icon white-icon"><i class="bi bi-car-front-fill"></i></div>
          <div>
            <p>Available Slots</p>
            <h2 id="slotsPageAvailable">--</h2>
          </div>
        </div>
        <div class="slot-stat-card">
          <div class="slot-stat-icon"><i class="bi bi-calendar-check"></i></div>
          <div>
            <p>Today's Revenue</p>
            <h2 id="slotsPageRevenue">--</h2>
          </div>
        </div>
      </section>

      <section class="slots-grid-section">
        <div class="slots-grid" id="slotsPageGrid"></div>
        <div class="vehicles-table-card mt-4" id="slotDetailsCard">
          <h4 class="mb-3">Slot Details</h4>
          <div id="slotDetailsContent">Select a slot to view details.</div>
        </div>
        <div class="vehicles-table-footer parking-slots-footer">
          <div class="vehicles-pagination" id="slotsPagination">
            <button type="button" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button>
            <button type="button" class="active" aria-current="page">1</button>
            <button type="button">2</button>
            <button type="button" aria-label="Next page"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </section>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script src="script.js?v=9"></script>
</body>
</html>
