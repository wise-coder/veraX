<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>veraX | Vehicles</title>
  <script src="theme.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <h3 class="sidebar-brand">veraX</h3>

    <ul>
      <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="active"><a href="vehicles.html"><i class="bi bi-car-front-fill"></i> Vehicles</a></li>
      <li><a href="parking-slots.html"><i class="bi bi-p-square"></i> Parking Slots</a></li>
      <li><a href="transactions.html"><i class="bi bi-arrow-left-right"></i> Transactions</a></li>
      <li><a href="payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
      <li><a href="reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a></li>
      <li><a href="users.html"><i class="bi bi-people"></i> Users</a></li>
      <li><a href="settings.html"><i class="bi bi-gear"></i> Settings</a></li>
      <li><a href="login.html" data-logout><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>

    <div class="sidebar-illustration" aria-hidden="true">
      <img class="sidebar-car-image" src="images/vecteezy_white-modern-car-isolated-on-transparent-background-3d_29913085.png" alt="">
      <div class="parking-post">P</div>
    </div>
  </aside>

  <main class="main vehicles-main">
    <nav class="topbar">
      <button type="button" class="menu-toggle" aria-label="Open navigation">
        <i class="bi bi-list menu-icon"></i>
      </button>
      <div class="admin">
        <i class="bi bi-bell"></i>
        <div class="avatar"></div>
        <div>
          <strong>Admin</strong>
          <small>Administrator</small>
        </div>
        <i class="bi bi-chevron-down admin-chevron"></i>
      </div>
    </nav>

    <section class="vehicles-page">
      <div class="vehicles-page-header">
        <h1>Vehicles</h1>
        <button class="vehicles-add-btn" type="button" id="addVehicleRecord">
          <i class="bi bi-plus-lg"></i>
          Add New Vehicle
        </button>
      </div>

      <div class="vehicles-search-card">
        <i class="bi bi-search"></i>
        <input type="search" id="vehicleSearch" placeholder="Search vehicle...">
      </div>

      <div class="vehicles-table-card">
        <table class="vehicles-table">
          <thead>
            <tr>
              <th>Plate Number</th>
              <th>Owner Name</th>
              <th>Phone Number</th>
              <th>Vehicle Type</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="vehiclesPageTable"></tbody>
        </table>

        <div class="vehicles-table-footer">
          <p id="vehiclesTableInfo">Loading vehicles...</p>
          <div class="vehicles-pagination" id="vehiclesPagination">
            <button type="button" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button>
            <button type="button" class="active" aria-current="page">1</button>
            <button type="button" aria-label="Next page"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script src="script.js?v=6"></script>
</body>
</html>
